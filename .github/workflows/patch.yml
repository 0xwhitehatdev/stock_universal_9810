name: Patch Boot Image

on:
  workflow_run:
    workflows: ["Build Android Kernel"]
    types:
      - completed

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download latest successful kernel artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: main.yml          # <-- your build workflow filename
          workflow_conclusion: success
          name: kernel                 # <-- artifact name from build workflow
          path: artifact

      - name: Verify artifact
        run: |
          ls -lah artifact

      - name: Extract artifact (if zipped)
        run: |
          mkdir out/kernel -p

          FILE=$(find artifact -maxdepth 1 -type f | head -1)

          case "$FILE" in
            *.zip)
              unzip -o "$FILE" -d out/kernel
              ;;
            *.tar.gz|*.tgz)
              tar -xzf "$FILE" -C out/kernel
              ;;
            *)
              cp -r artifact/* out/kernel/
              ;;
          esac


      - name: Clone Local Kitchen 
        run: |
             git clone --depth=1 https://github.com/0xwhitehatdev/Kitchen.git

      - name: Clone mktool
        run: |
          git clone --depth=1 https://github.com/GameTheory-/mktool.git

      - name: Make backend tools executable
        run: |
          chmod +x mktool/tools/*
          ls -lah mktool/tools

      - name: Unpack boot.img
        run: |
          mkdir unpack

          ./mktool/tools/unpackbootimg \
            -i Kitchen/boot.img \
            -o unpack
          ls unpack

      - name: Replace kernel
        run: |
          cp out/kernel/Image unpack/boot.img-kernel

      - name: Repack boot.img
        run: |


          BASE=$(cat unpack/boot.img-base)
          BOARD=$(cat unpack/boot.img-board)
          CMDLINE=$(cat unpack/boot.img-cmdline)
          HASH_TYPE=$(cat unpack/boot.img-hashtype)
          KERNEL="unpack/boot.img-kernel"
          KOFF=$(cat unpack/boot.img-kernel_offset)
          PATCH_LVL=$(cat unpack/boot.img-os_patch_level)
          OS_VERSION=$(cat unpack/boot.img-os_version)
          PAGESIZE=$(cat unpack/boot.img-pagesize)
          RAM_DISK="unpack/boot.img-ramdisk"
          ROFF=$(cat unpack/boot.img-ramdisk_offset)
          SOFF=$(cat unpack/boot.img-second_offset)
          TOFF=$(cat unpack/boot.img-tags_offset)

          ./mktool/tools/mkbootimg \
                --kernel "$KERNEL" \
                --ramdisk "$RAM_DISK" \
                --cmdline "$CMDLINE" \
                --base "$BASE" \
                --pagesize "$PAGESIZE" \
                --kernel_offset "$KOFF" \
                --ramdisk_offset "$ROFF" \
                --second_offset "$SOFF" \
                --tags_offset "$TOFF" \
                --dt unpack/boot.img-dt \
                --board "$BOARD" \
                --os_version "$OS_VERSION" \
                --os_patch_level "$PATCH_LVL" \
                --hashtype "$HASH_TYPE" \
                -o boot-new.img
            
      - uses: actions/upload-artifact@v4
        with:
          name: boot-new
          path: boot-new.img
            --second_offset "$SOFF" \
            --tags_offset "$TOFF" \
            --hash "$HASH" \
            $DT \
            -o boot-new.img

      - uses: actions/upload-artifact@v4
        with:
          name: boot-new
          path: boot-new.img
